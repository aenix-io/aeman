services:
  aeman:
    build:
      context: .
      args:
        VERSION: ${AEMAN_VERSION:-docker}
    image: aeman:latest
    restart: unless-stopped
    environment:
      # GitHub OAuth App credentials (enables multi-user mode).
      AEMAN_GITHUB_CLIENT_ID: ${AEMAN_GITHUB_CLIENT_ID:?set in .env}
      AEMAN_GITHUB_CLIENT_SECRET: ${AEMAN_GITHUB_CLIENT_SECRET:?set in .env}
      # Public origin; the OAuth callback is <AEMAN_BASE_URL>/auth/callback.
      AEMAN_BASE_URL: ${AEMAN_BASE_URL:?set in .env}
      AEMAN_SCOPES: ${AEMAN_SCOPES:-repo project}
      # Optional: pin the UI to one board (set all three to lock it).
      AEMAN_OWNER: ${AEMAN_OWNER:-}
      # The board number. AEMAN_PROJECT is the pre-rename name, still read as a
      # fallback so an existing .env keeps working across the upgrade — "project"
      # now means aeman's planning entity, not the GitHub board.
      AEMAN_BOARD: ${AEMAN_BOARD:-${AEMAN_PROJECT:-}}
      AEMAN_LOCK_BOARD: ${AEMAN_LOCK_BOARD:-}
      # Persist sessions so a restart doesn't sign everyone out.
      AEMAN_SESSION_FILE: ${AEMAN_SESSION_FILE:-/data/sessions.json}
    volumes:
      - aeman_sessions:/data
    # Only Caddy talks to aeman, over the compose network.
    expose:
      - "8765"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AEMAN_DOMAIN: ${AEMAN_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aeman

volumes:
  aeman_sessions:
  caddy_data:
  caddy_config:
