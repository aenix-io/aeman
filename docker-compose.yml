services:
  aeman:
    build:
      context: .
      args:
        VERSION: ${AEMAN_VERSION:-docker}
    image: aeman:latest
    restart: unless-stopped
    environment:
      # The board's repositories (name=url, comma-separated, primary first) and
      # the server's own credential for them (fetch, push, membership checks).
      AEMAN_REPOS: ${AEMAN_REPOS:?set in .env}
      AEMAN_GIT_TOKEN: ${AEMAN_GIT_TOKEN:-}
      # A repository may carry its own credential instead — pass the
      # AEMAN_GIT_TOKEN_<NAME> variables the board needs (see .env.example);
      # one of the two forms must cover every repository.
      AEMAN_GIT_TOKEN_AEMAN_DB: ${AEMAN_GIT_TOKEN_AEMAN_DB:-}
      # Forge: github or gitlab. Empty follows the primary repository's host.
      AEMAN_FORGE: ${AEMAN_FORGE:-}
      # Base URL of a self-hosted GitLab; empty means the primary repository's host.
      AEMAN_GITLAB_URL: ${AEMAN_GITLAB_URL:-}
      # OAuth application credentials (enable multi-user mode). Exactly ONE pair
      # is required: the GitHub one or the GitLab one.
      AEMAN_GITHUB_CLIENT_ID: ${AEMAN_GITHUB_CLIENT_ID:-}
      AEMAN_GITHUB_CLIENT_SECRET: ${AEMAN_GITHUB_CLIENT_SECRET:-}
      AEMAN_GITLAB_CLIENT_ID: ${AEMAN_GITLAB_CLIENT_ID:-}
      AEMAN_GITLAB_CLIENT_SECRET: ${AEMAN_GITLAB_CLIENT_SECRET:-}
      # Public origin; the OAuth callback is <AEMAN_BASE_URL>/auth/callback.
      AEMAN_BASE_URL: ${AEMAN_BASE_URL:?set in .env}
      # OAuth scopes; empty means the forge's default.
      AEMAN_SCOPES: ${AEMAN_SCOPES:-}
      # Optional: pin the UI to one board (set all three to lock it).
      AEMAN_OWNER: ${AEMAN_OWNER:-}
      # The board number. AEMAN_PROJECT is the pre-rename name, still read as a
      # fallback so an existing .env keeps working across the upgrade — "project"
      # now means aeman's planning entity, not the GitHub board.
      AEMAN_BOARD: ${AEMAN_BOARD:-${AEMAN_PROJECT:-}}
      AEMAN_LOCK_BOARD: ${AEMAN_LOCK_BOARD:-}
      # Persist sessions so a restart doesn't sign everyone out.
      AEMAN_SESSION_FILE: ${AEMAN_SESSION_FILE:-/data/sessions.json}
    volumes:
      # Sessions and the repository clones (AEMAN_DATA defaults to /data).
      - aeman_sessions:/data
    # Only Caddy talks to aeman, over the compose network.
    expose:
      - "8765"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AEMAN_DOMAIN: ${AEMAN_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aeman

volumes:
  aeman_sessions:
  caddy_data:
  caddy_config:
