openapi: 3.0.3
info:
  title: aeman
  version: "1"
  description: >-
    The REST surface of one aeman board. Resources are Kubernetes-style —
    {kind, metadata, spec, status} — and everything with board-level rules is an
    action: a client states intent and the server applies the rules. A write
    that leaves nothing to show answers 204; every refusal is an RFC 9457
    problem whose `code` names the rule.


    Three headers belong to the middleware and are documented in docs/api.md
    rather than declared here: `X-Aeman-Client` on a request keys echo
    suppression on the watch, `X-Aeman-As-Of` says the caller is looking at a
    past day, which refuses a WRITE to a card that day is over for, and
    `X-Aeman-Stale` rides a READ answered from a cache being revalidated. They
    are the middleware's, so no operation declares them.
servers:
  - url: /api/v1
tags:
  - name: Board
    description: The board itself — its roster, its boards, and the stream of what changes.
  - name: Cards
    description: Cards, the gestures a board draws on them, and what they carry.
  - name: Notes
    description: A card's work notes.
  - name: Sprints
    description: Per-team sprint pointers and the carry-over.
  - name: Epics
    description: The Project board's columns.
  - name: Processes
    description: Recurring work and the tasks it iterates on.
  - name: Deadlines
    description: The deadline lines a project draws across the weeks.
  - name: Projects
    description: The Project board's top grouping.
  - name: Teams
    description: Team names and what a team gets through in a week.
  - name: Presence
    description: Who is looking at what, right now.
  - name: Meta
    description: The description of this surface.
paths:
  /board:
    get:
      operationId: getBoard
      tags: [Board]
      summary: >-
        The board: title, the team roster, the Project board's structure, the
        people and the visitor's domains.
      description: >-
        The board is the one the server was started with — there is no
        addressing parameter, and "project" is aeman's own planning entity. Ask
        it with the same day selector as the listing beside it: a past day's
        SPRINT POINTERS come with that day's cards, and today's pointers over
        that day's cards drop nearly all of them.
      parameters:
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/BoardOfView'
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        default:
          $ref: '#/components/responses/Problem'
  /views:
    get:
      operationId: listViews
      tags: [Board]
      summary: The boards a caller may open, each with the gestures it draws.
      responses:
        '200':
          description: The catalog of boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards:
    get:
      operationId: listCards
      tags: [Cards]
      summary: List the cards that board draws, in board order.
      description: >-
        A listing is the board-ROW shape: no `spec.description` — `status.links`
        carries the refs extracted from it — and the body itself is one
        GET /cards/{uid} away. `fields=full` opts a genuine bulk reader into
        complete cards. Every listing is the visitor's projection: cards in
        domains they cannot read are not there.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Weeks'
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: What that board draws.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCard
      tags: [Cards]
      summary: Create the card that board makes.
      description: >-
        A create means what the board means by it: typed into `me` the card is
        yours, today, in the sprint and in the unplanned band; into `team` it
        lands in the Unassigned column unless somebody is named; into `triage`
        it is scheduled for a week; into `backlog` it is parked on the team's
        shelf; into `project` it is a slot under a column. Each board refuses
        the fields it does not own — a parked card typed into a day, a column
        named on the Me board — with a 422 that says which field it was. A title
        that is nothing but a GitHub issue/PR URL becomes that item's real
        title, with the link moved into the description.
      parameters:
        - $ref: '#/components/parameters/View'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: The card as it was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/watch:
    get:
      operationId: watchView
      tags: [Board]
      summary: Watch that board over a WebSocket.
      description: >-
        An upgrade, not a response: each text frame that follows is one
        `#/components/schemas/WatchFrame`. With the narrowing parameters the
        subscription is SCOPED — a card entering the selection arrives as ADDED
        and one leaving it as DELETED — while `view=all` with no selectors is
        the raw board stream. `resources` picks the kinds and `client` keys echo
        suppression: a change made with the same `X-Aeman-Client` is not
        streamed back on that connection.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Weeks'
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
        - name: resources
          in: query
          required: false
          description: >-
            A comma-separated set of the kinds to receive; the default is
            cards,sprints,ordering,presence.
          schema:
            type: string
        - name: client
          in: query
          required: false
          description: The client id changes are attributed to, for echo suppression.
          schema:
            type: string
      responses:
        '101':
          description: Switching to the WebSocket stream.
  /views/{view}/cards/{uid}/actions/remove:
    post:
      operationId: removeCard
      tags: [Cards]
      summary: The board's × — hand the card back to a home it still has, or delete it by that board's rules.
      description: >-
        `intent` says which of the ×'s two meanings is wanted: `unassign`
        empties the working area and leaves the card in its week or its column,
        `off-board` takes it away with the subtasks that were pieces of it.
        Omitted, the gesture decides for itself. `off-board` on a Project-board
        slot or a process turn is 422 — those belong to another board's plan;
        `unassign` on a card with no week and no column is 422 too, since it
        would leave the card nowhere at all.


        From the Me board the × is the narrow one: a person takes off their own
        board what they PUT there and what the plan has not taken up. Work
        another person scheduled for them, or work they scheduled on the Team or
        Triage board, is somebody's plan and is refused there (403) — the wide ×
        lives on the board where the planning was done, and the answer to "I am
        not doing this" is `spec.stage: refuse`. A card with no recorded author
        is not exempt, and a subtask is outside the rule.


        The × empties the WORKING AREA: assignee, sprint and dates cleared (a
        slot keeps its dates — they are its row). The card then lands wherever
        it still belongs — the week it is scheduled for, or its Project-board
        column. With nowhere else to be the working area was its only home, and
        the × deletes it. It takes the card's subtasks with it; a subtask
        standing in a column of its own is freed into that column instead, and
        one whose column cannot come along (a column of the parent's repository)
        is answered like any other columnless card, which is deletion. A deleted
        card is not lost to the board's history: the day it stood on gives it
        back. DELETE /cards/{uid} is the deliberate delete, and it FREES a
        card's subtasks rather than taking them along.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Weeks'
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCardBody'
      responses:
        '204':
          description: The card is off that board.
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards/{uid}/actions/place:
    post:
      operationId: placeCard
      tags: [Cards]
      summary: The Triage board's drop — put the card in a week, which is what triaging it means.
      description: >-
        `week` is a Monday; any other day is refused (422), since a week that is
        not a Monday matches no column the board draws. A week AHEAD of this one
        also empties the working area — the card is on no day board until that
        Monday — while the CURRENT week joins the team's sprint instead. A
        Project-board slot is refused (422): its week IS its start date's week,
        so its dates are what move. It is not the same as PATCH {"week": …},
        which writes the week and nothing else.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Weeks'
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceCardBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards/{uid}/actions/untriage:
    post:
      operationId: untriageCard
      tags: [Cards]
      summary: The Triage board's opposite — take the card's week away, back to the strip.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Weeks'
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards/{uid}/actions/finished-earlier:
    post:
      operationId: finishedEarlier
      tags: [Cards]
      summary: A day board's answer for work done in the sprint before this one and marked done now.
      description: >-
        It sends finished work back to the sprint it was done in, its dates and
        the day it counts as done along with it. A MOVE rather than a removal,
        which is why it has a door of its own.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Weeks'
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}:
    get:
      operationId: getCard
      tags: [Cards]
      summary: One card in full — the body lives here, not in listings.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchCard
      tags: [Cards]
      summary: Edit spec fields; only present fields apply, and an empty value clears.
      description: >-
        The server applies the rules as the UI would: the clamps, the review
        linkage, the calendar semantics of the dates. Fields are applied in the
        order the handler reads them, and the assignees last — ungrouping hands
        an ownerless child its parent's person, and a patch that also names
        assignees means the caller decided who owns it.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCard
      tags: [Cards]
      summary: Hard delete, cascading to the linked review card.
      description: >-
        The deliberate delete — "this card is a mistake" — as against the
        board's ×, which is "this work is off the board". It FREES the card's
        subtasks into standalone cards rather than taking them along.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: The card is gone.
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/move:
    post:
      operationId: moveCard
      tags: [Cards]
      summary: Reorder the card after (or before) another one.
      description: >-
        `before` wins when both are sent; an empty `after` puts the card at the
        top.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCardBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/defer:
    post:
      operationId: deferCard
      tags: [Cards]
      summary: Push the scheduled day N days ahead of today.
      description: >-
        Presses stack, and a card created today relocates fully. `days` must be
        positive — putting work OFF is the whole gesture — and a zero or
        negative one is 422.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferCardBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/in-progress:
    post:
      operationId: setInProgress
      tags: [Cards]
      summary: Move the card to the implicit In Progress status.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/reopen:
    post:
      operationId: reopenCard
      tags: [Cards]
      summary: Undo a done mark, restoring the progress the card had when done was set.
      description: >-
        The stage clears and the progress returns to what the card carried when
        it was marked done, the jump recorded in its log; with no history to
        read it falls back to In Progress.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/send-to-review:
    post:
      operationId: sendToReview
      tags: [Cards]
      summary: Send the card to a reviewer, or reassign the review that exists.
      description: >-
        The answer is the REVIEW card, whether it was created or reassigned. The
        reviewer must be able to read the card's domain. Without a `zone` the
        review lands in the unplanned one: for the reviewer it is work that
        turned up during their day, and the original's band says where the WORK
        stood, not where the asking belongs.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendToReviewBody'
      responses:
        '201':
          description: The review card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/mirror:
    post:
      operationId: mirrorCard
      tags: [Cards]
      summary: Show the card in a second Project-board column.
      description: >-
        One card, one file and one log, standing in both plans. The card must
        already be in a column; the target must exist, in the card's own
        repository, and must not be the card's own column; a subtask cannot be
        mirrored (all 422). Mirroring where it already stands is a no-op. The
        EPIC half is required — a column is named by its epic — while the
        project half may be empty, since the no-project bucket is a mirror home
        like any other.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/unmirror:
    post:
      operationId: unmirrorCard
      tags: [Cards]
      summary: Take one mirror column away; the home and everything else stay.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/remove-from-project:
    post:
      operationId: removeFromProject
      tags: [Cards]
      summary: The Project board's × — take the card out of one column.
      description: >-
        A mirror goes; the home with mirrors left hands its role to the first
        mirror; the last column drops the WEEK that was the slot's row, keeps a
        worked card (assignee and progress) as an orphan of the working area,
        and deletes the rest, cascading the linked review card. A SUBTASK is
        never deleted here — its other home is its parent, so the × only takes
        the column away. It answers 204 rather than the card, which may no
        longer exist.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementBody'
      responses:
        '204':
          description: The card is out of that column.
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/remove-reviewer:
    post:
      operationId: removeReviewer
      tags: [Cards]
      summary: Delete the linked review card.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/links:
    get:
      operationId: listLinks
      tags: [Cards]
      summary: The URLs found in the card's description, GitHub refs resolved and listed first.
      description: >-
        Only github.com references are recognised; GitLab issue and
        merge-request links are plain links for now.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card's links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkList'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/log:
    get:
      operationId: getCardLog
      tags: [Cards]
      summary: The card's activity feed — recorded events and work notes, one chronological list.
      description: >-
        Read from the repository's history: every commit that touched the card
        is one or more events, with the commit's author and time, merged with
        its notes. A change made by a direct git write shows up like any other.
        This is one card's whole history; for a day's feed across many cards ask
        GET /logs.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card's feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        default:
          $ref: '#/components/responses/Problem'
  /logs:
    get:
      operationId: getDayLogs
      tags: [Cards]
      summary: One day's feed for many cards at once — what a day board shows.
      description: >-
        The history walk stops at the day's first moment, so this costs a
        fraction of a log per card: asking a whole log per card is what made a
        board open fire dozens of slow requests. A card that was quiet that day
        is present with an empty list; a card the visitor cannot read is absent.
      parameters:
        - name: day
          in: query
          required: false
          description: The board day to read, yyyy-mm-dd. Empty or absent is today.
          schema:
            type: string
            pattern: '^(\d{4}-\d{2}-\d{2})?$'
        - name: uids
          in: query
          required: false
          description: The cards to read, comma-separated; at most 200 per request.
          schema:
            type: string
      responses:
        '200':
          description: That day, per card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLogList'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/notes:
    get:
      operationId: listNotes
      tags: [Notes]
      summary: The card's work notes.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addNote
      tags: [Notes]
      summary: Append a work note.
      description: >-
        Every note mutation answers the card's whole thread, so clients converge
        on the server's view of it rather than on their own idea of the order.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteBody'
      responses:
        '201':
          description: The thread with the new note in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/notes/{noteId}:
    patch:
      operationId: editNote
      tags: [Notes]
      summary: Edit a work note.
      parameters:
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteBody'
      responses:
        '200':
          description: The thread after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteNote
      tags: [Notes]
      summary: Delete a work note.
      parameters:
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: The thread the note has left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
  /sprints:
    get:
      operationId: listSprints
      tags: [Sprints]
      summary: Per-team sprint pointers.
      description: >-
        Ask it with the same day selector as the listing beside it: a past day's
        pointers come with that day's cards, and the client's own view rules
        compare a card's sprint against them.
      parameters:
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/BoardOfView'
      responses:
        '200':
          description: The pointers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintList'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchSprint
      tags: [Sprints]
      summary: Set a team's sprint pointer directly.
      description: >-
        A team is declared by its first sprint write, in the `domain` the caller
        picks; an existing team's pointer stays where the team is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprintPatch'
      responses:
        '200':
          description: The pointer as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        default:
          $ref: '#/components/responses/Problem'
  /people/{login}:
    patch:
      operationId: patchPerson
      tags: [Board]
      summary: Set the points a week a PERSON gets through.
      description: >-
        The number a day board measures their load against. 0 takes a set number
        back and nothing derives one; outside 0..999, or a login that could not
        be one, is 422. It answers the whole Board resource, whose members carry
        `load` and `capacity` — that is what the client redraws.
      parameters:
        - $ref: '#/components/parameters/Login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonPatch'
      responses:
        '200':
          description: The board, with the person's new number in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        default:
          $ref: '#/components/responses/Problem'
  /sprints/actions/carry-over:
    post:
      operationId: carryOver
      tags: [Sprints]
      summary: Advance a team's sprint to today and carry its unfinished cards.
      description: >-
        Finished recurrent cards reseed as fresh copies. With `dryRun` the
        counts are reported and nothing changes, which is what backs a confirm
        dialog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarryOverBody'
      responses:
        '200':
          description: What was carried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarryReport'
        default:
          $ref: '#/components/responses/Problem'
  /sprints/actions/reorder-teams:
    post:
      operationId: reorderTeams
      tags: [Sprints]
      summary: Apply a shared team order.
      description: >-
        The hidden sprint-state cards are moved into the given sequence, so
        every client reads the same order back from the board metadata. Teams
        missing from the list keep their positions after the reordered ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTeamsBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /sprints/actions/delete-team:
    post:
      operationId: deleteTeam
      tags: [Sprints]
      summary: Delete a team's sprint pointer; refused while cards still use the team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamBody'
      responses:
        '204':
          description: The team is gone from the roster.
        default:
          $ref: '#/components/responses/Problem'
  /epics:
    post:
      operationId: addEpic
      tags: [Epics]
      summary: Declare an epic column inside a project.
      description: The project is required and must exist; the column lives with its project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEpicBody'
      responses:
        '204':
          description: The column is declared.
        default:
          $ref: '#/components/responses/Problem'
  /epics/actions/delete-epic:
    post:
      operationId: deleteEpic
      tags: [Epics]
      summary: Delete an EMPTY epic column; refused while cards sit under it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpicBody'
      responses:
        '204':
          description: The column is gone.
        default:
          $ref: '#/components/responses/Problem'
  /epics/actions/reorder-epics:
    post:
      operationId: reorderEpics
      tags: [Epics]
      summary: Apply one project's column order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderEpicsBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /epics/actions/set-project:
    post:
      operationId: setEpicProject
      tags: [Epics]
      summary: Move a column from one project to another; an empty target detaches it.
      description: >-
        Its cards are rewritten with it. The column cannot change REPOSITORY —
        its stub is written back to the repository that holds it — so a target
        project of another one is refused (422), and the name must be free in
        the destination, the no-project bucket included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEpicProjectBody'
      responses:
        '204':
          description: The column belongs to the other project now.
        default:
          $ref: '#/components/responses/Problem'
  /epics/actions/rename:
    post:
      operationId: renameEpic
      tags: [Epics]
      summary: Rename a column in place, cards and all.
      description: >-
        A name already used inside the SAME project is refused (422); the same
        name in another project is fine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameEpicBody'
      responses:
        '204':
          description: The column is renamed.
        default:
          $ref: '#/components/responses/Problem'
  /processes:
    get:
      operationId: listProcesses
      tags: [Processes]
      summary: The Process tab — every process with its tasks and each task's history.
      parameters:
        - name: project
          in: query
          required: false
          description: Keep only the processes of one project; empty is every project.
          schema:
            type: string
      responses:
        '200':
          description: The processes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addProcess
      tags: [Processes]
      summary: Declare a process — recurring work inside a project.
      description: >-
        A process with a project lives with the project; `domain` picks the
        repository for a project-less one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProcessBody'
      responses:
        '204':
          description: The process is declared.
        default:
          $ref: '#/components/responses/Problem'
  /processes/actions/delete-process:
    post:
      operationId: deleteProcess
      tags: [Processes]
      summary: Delete an EMPTY process; refused while it has tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessBody'
      responses:
        '204':
          description: The process is gone.
        default:
          $ref: '#/components/responses/Problem'
  /processes/actions/rename:
    post:
      operationId: renameProcess
      tags: [Processes]
      summary: Rename a process; its tasks follow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProcessBody'
      responses:
        '204':
          description: The process is renamed.
        default:
          $ref: '#/components/responses/Problem'
  /processes/actions/set-project:
    post:
      operationId: setProcessProject
      tags: [Processes]
      summary: Move a process to another project; an empty project is the no-project bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProcessProjectBody'
      responses:
        '204':
          description: The process belongs to the other project now.
        default:
          $ref: '#/components/responses/Problem'
  /processes/actions/set-paused:
    post:
      operationId: setProcessPaused
      tags: [Processes]
      summary: Pause a process, or resume it.
      description: >-
        A paused process files no turns and projects none; resuming files what
        the current week is owed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProcessPausedBody'
      responses:
        '204':
          description: The process is paused, or running again.
        default:
          $ref: '#/components/responses/Problem'
  /processes/actions/reorder:
    post:
      operationId: reorderProcesses
      tags: [Processes]
      summary: Apply a shared process order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProcessesBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /processes/tasks/actions/reorder:
    post:
      operationId: reorderProcessTasks
      tags: [Processes]
      summary: Apply one process's task order.
      description: >-
        A uid from another process is adopted into this one — which is how a
        cross-process drop lands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProcessTasksBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /processes/tasks:
    post:
      operationId: addTask
      tags: [Processes]
      summary: Add what a process iterates on.
      description: >-
        A task says what every turn is called and says, its cycle (counted on
        the calendar from its start date, not from when the last turn closed),
        the team the turns land in and the standing owner. The server files what
        each week is owed by itself, as the week arrives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: The uid of the new task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRef'
        default:
          $ref: '#/components/responses/Problem'
  /processes/tasks/{uid}:
    patch:
      operationId: patchTask
      tags: [Processes]
      summary: Change what the NEXT turns will be; the running one is untouched.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '204':
          description: The task is changed.
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteTask
      tags: [Processes]
      summary: Delete a task; its past turns stay as the record.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: The task is gone.
        default:
          $ref: '#/components/responses/Problem'
  /deadlines:
    post:
      operationId: addDeadline
      tags: [Deadlines]
      summary: Mark a week with a project's deadline line.
      description: >-
        A project holds at most one per week; any day resolves to its Monday,
        and asking twice changes nothing. Two projects can each have something
        due the same week, and those are two lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineBody'
      responses:
        '204':
          description: The line is drawn.
        default:
          $ref: '#/components/responses/Problem'
  /deadlines/actions/delete:
    post:
      operationId: deleteDeadline
      tags: [Deadlines]
      summary: Clear a project's deadline on a week.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineBody'
      responses:
        '204':
          description: The line is gone.
        default:
          $ref: '#/components/responses/Problem'
  /deadlines/actions/move:
    post:
      operationId: moveDeadline
      tags: [Deadlines]
      summary: Drag a project's deadline to another week.
      description: >-
        Landing where it already has one leaves a single line; another project's
        line on that week is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveDeadlineBody'
      responses:
        '204':
          description: The line has moved.
        default:
          $ref: '#/components/responses/Problem'
  /projects:
    post:
      operationId: addProject
      tags: [Projects]
      summary: Declare a project — the Project board's top grouping, which owns epic columns.
      description: It may be created empty; `domain` picks the repository it is declared in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectBody'
      responses:
        '204':
          description: The project is declared.
        default:
          $ref: '#/components/responses/Problem'
  /projects/actions/delete-project:
    post:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete an EMPTY project; refused while it still owns columns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBody'
      responses:
        '204':
          description: The project is gone.
        default:
          $ref: '#/components/responses/Problem'
  /projects/actions/reorder-projects:
    post:
      operationId: reorderProjects
      tags: [Projects]
      summary: Apply the shared project order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProjectsBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /projects/actions/rename:
    post:
      operationId: renameProject
      tags: [Projects]
      summary: Rename a project in place; its columns and their cards follow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectBody'
      responses:
        '204':
          description: The project is renamed.
        default:
          $ref: '#/components/responses/Problem'
  /teams/actions/rename:
    post:
      operationId: renameTeam
      tags: [Teams]
      summary: Rename a team in place, its cards and process tasks along with it.
      description: >-
        Its declaration keeps its sprint pointer. A name another team has is
        refused (422), and the no-team group cannot be renamed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTeamBody'
      responses:
        '204':
          description: The team is renamed.
        default:
          $ref: '#/components/responses/Problem'
  /teams/actions/capacity:
    post:
      operationId: setTeamCapacity
      tags: [Teams]
      summary: Set the points a week a team gets through.
      description: >-
        The number a week of the team's plan is weighed against, stored in the
        team's own file. 0 takes it back and the board derives none; outside
        0..999 is 422, and so is a team the board does not declare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCapacityBody'
      responses:
        '204':
          description: The number is recorded.
        default:
          $ref: '#/components/responses/Problem'
  /presence:
    post:
      operationId: setPresence
      tags: [Presence]
      summary: Share the caller's live card selection; an empty card clears it.
      description: >-
        Ephemeral shared-cursor state, broadcast over the watch and never
        persisted. The login is the caller's authenticated identity, not a
        client-supplied value, and the client id (`X-Aeman-Client`) keys it, so
        a closed tab clears its own mark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceBody'
      responses:
        '204':
          description: The selection is shared.
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Uid:
      name: uid
      in: path
      required: true
      description: The card's own address, a ULID assigned at creation.
      schema:
        type: string
    View:
      name: view
      in: path
      required: true
      description: >-
        The board the caller is standing on: me, team, triage, backlog, project,
        or all — the escape hatch, which has to be said out loud. A board nobody
        has is a route that is not there (404).
      schema:
        type: string
    NoteId:
      name: noteId
      in: path
      required: true
      description: The note's id inside the card.
      schema:
        type: string
    Login:
      name: login
      in: path
      required: true
      description: The person's forge login.
      schema:
        type: string
    Team:
      name: team
      in: query
      required: false
      description: >-
        A comma-separated set of team keys; the listings union them. Empty is
        every team, and the no-team group is the empty key.
      schema:
        type: string
    Day:
      name: day
      in: query
      required: false
      description: The day a day board is read for, yyyy-mm-dd. Empty or absent is today.
      schema:
        type: string
        pattern: '^(\d{4}-\d{2}-\d{2})?$'
    User:
      name: user
      in: query
      required: false
      description: >-
        Whose Me board to read. Who-am-I is resolved server-side, so a caller
        needs none; an explicit one wins, for a lead looking at somebody else's
        day.
      schema:
        type: string
    From:
      name: from
      in: query
      required: false
      description: >-
        The Monday the Triage window opens on; empty or absent is the current
        week.
      schema:
        type: string
        pattern: '^(\d{4}-\d{2}-\d{2})?$'
    Weeks:
      name: weeks
      in: query
      required: false
      description: >-
        How many weeks the Triage window covers, that Monday included: 1..26,
        default 6. Anything else is refused (400). A client must ask for every
        week it intends to DRAW.
      schema:
        type: string
    Project:
      name: project
      in: query
      required: false
      description: >-
        One project's columns, for the Project board; empty is every project,
        including the columns that belong to none.
      schema:
        type: string
    Assignee:
      name: assignee
      in: query
      required: false
      description: Keep only the cards on one person.
      schema:
        type: string
    Stage:
      name: stage
      in: query
      required: false
      description: >-
        Keep only the cards carrying one stage; present and empty means the
        cards carrying none.
      schema:
        type: string
    Zone:
      name: zone
      in: query
      required: false
      description: >-
        Keep only the cards in one band; present and empty means the cards in
        none. The filter reads the same answer the listing states, so the two
        never disagree about a card.
      schema:
        type: string
    Focus:
      name: focus
      in: query
      required: false
      description: >-
        "true" or "1" keeps only the cards workable right now — done, on-review
        and locked are dropped.
      schema:
        type: string
    Reviews:
      name: reviews
      in: query
      required: false
      description: >-
        "true" or "1" brings review cards into the view: on me and team each
        card's linked review is APPENDED, on triage the reviews the grid
        otherwise leaves out are KEPT, standing in the week their own dates fall
        in. Off by default in both.
      schema:
        type: string
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        The resource shape a listing delivers: "summary" (the default, a board
        row with no description) or "full". Anything else is refused (400).
      schema:
        type: string
    Snapshot:
      name: snapshot
      in: query
      required: false
      description: >-
        "true" or "1", with a PAST day on a me or team board: the board as it
        STOOD when that day ended, rather than today's cards filtered by that
        day's dates. Whether a day is over is asked per team. A day the clone's
        history no longer reaches is 410, and storage that keeps no history
        answers 501. Ignored where a board has no records to give.
      schema:
        type: string
    BoardOfView:
      name: view
      in: query
      required: false
      description: >-
        Which board is asking, for a read with no board segment of its own: only
        a DAY board has a day to be a record of, so the snapshot flag is ignored
        for the others.
      schema:
        type: string
  responses:
    Problem:
      description: >-
        The request was refused. The status says whose fault it was, `detail` is
        the sentence to show a person, and `code` is what a program branches on.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: An RFC 9457 problem detail, with two extension members.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: >-
            Always "about:blank": there is no page per problem, and `code`
            carries the identity.
        title:
          type: string
          description: The status code's own text.
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        detail:
          type: string
          description: The sentence to show a person.
        code:
          type: string
          description: >-
            The rule that refused, for a program to branch on. For a rule of the
            board it is that rule's own name.
          enum:
            - accessUndecided
            - authorizationExpired
            - backwardsDefer
            - badCapacity
            - badDay
            - bodyTooLarge
            - capacityRequired
            - cardNotFound
            - cardNotOnBoard
            - crossDomain
            - crossSiteBlocked
            - dayIsARecord
            - descriptionTooLong
            - domainConflict
            - emptyNote
            - emptyTitle
            - endBeforeStart
            - epicExists
            - epicInUse
            - epicNotFound
            - epicRequired
            - forbidden
            - gestureNotOffered
            - historyTruncated
            - invalidAsOf
            - invalidBody
            - invalidDay
            - invalidSelector
            - invalidStage
            - nameTaken
            - noColumn
            - noEarlierSprint
            - noHistory
            - noPlaceOfItsOwn
            - noReviewer
            - noSuchView
            - notAMonday
            - notAuthenticated
            - notFinished
            - notInProject
            - notOnThisBoard
            - notRecurrent
            - notYoursToDestroy
            - notYoursToPark
            - notYoursToRefuse
            - notYoursToRemove
            - noteNotFound
            - noteTooLong
            - nowhereToLeaveIt
            - openSubtasks
            - outsideCycle
            - ownColumn
            - parentNotFound
            - pointsRequired
            - processExists
            - processInUse
            - processNotFound
            - projectExists
            - projectInUse
            - projectNotFound
            - setupRequired
            - subtaskDepth
            - subtaskMirror
            - subtaskTie
            - subtaskWeek
            - taskNotFound
            - teamExists
            - teamInUse
            - teamNotFound
            - titleTooLong
