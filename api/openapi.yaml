      description: The user's intent — everything an edit can change.
      required: [title, assignees, progress, dates]
      properties:
        title:
          type: string
        description:
          type: string
          description: >-
            The card's body. ABSENT in a listing — that is the "not loaded"
            marker — and always present, possibly empty, on a full resource, so
            an empty body never reads as a missing one.
        team:
          type: string
        zone:
          type: string
          description: >-
            The band the card stands in, by meaning rather than by colour. A
            card in the WORKING AREA — one carrying a sprint or dates of its own
            — always answers with a band: nobody having said means "planned",
            which is where every board draws it anyway. Absent is reserved for
            cards that are on no day (the strip, a shelf, a week to come), where
            "no band yet" is a state a client draws as one.
          enum: [urgent, unplanned, planned, niceToHave]
        size:
          type: string
          description: >-
            What somebody said the card weighs. The points a board sums are
            derived from it — S 1, M 2, L 4, XL 8 — never stored, and a card
            with SUBTASKS weighs their sum instead of its own size (the umbrella
            rule: a parent's estimate stands until its children exist, then they
            replace it, and nothing counts twice). A card nobody has sized
            weighs M — except a review card, which weighs S — and that default
            is what the SUMS use, never a value written to the card, so the
            field stays absent on it. A size the board does not know is answered
            as absent rather than echoed back.
          enum: [S, M, L, XL]
