          type: string
          description: >-
            A recurrent card's reseed cycle: absent is every sprint, "week" and
            "month" once the interval has elapsed.
        dates:
          $ref: '#/components/schemas/CardDates'
        parked:
          type: boolean
          description: >-
            The task is in its team's BACKLOG rather than in work. A task is in
            work (a date or a sprint) or parked, never both and never neither:
            parking empties the working area — person, sprint, dates — takes
            the card's subtasks off the board with it, withdraws any unfinished
            review of it, and keeps its place in the board's order; giving a parked
            task a date or a sprint (or `own` with a person) takes it out of the
            backlog. `false` alone on a parked task with no date and no sprint
            is refused (422 `takeIntoWork`): a task leaves its backlog by being
            taken into work. Every team has a backlog and nothing declares it. A
            review card and a subtask are refused (422): neither has a place of
            its own to be parked in. A task has no week.
        priority:
          type: string
          enum: ["", P0, P1, P2, P3, P4]
          description: >-
            The card's OWN priority (`POST /cards/{uid}/actions/priority`);
            what it counts under is `status.effectivePriority`.
        reviewOf:
          type: string
        parent:
          type: string
          description: >-
            The uid of the card this one sits under — the one link of the
            hierarchy. Its meaning is the parent's `type`: under a task this
            card is a subtask; under a goal, an initiative or an epic it is
            filed in the hierarchy and nothing else about it changes.
        type:
          type: string
          description: >-
            The card's level. Absent for a task; `goal`, `initiative` or `epic`
            for a PLANNING card, which the Roadmap draws and no day board
            does. Fixed at create.
          enum: [goal, initiative, epic]
