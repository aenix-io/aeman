            $ref: '#/components/schemas/Note'
    ViewList:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [ViewList]
        items:
          type: array
          items:
            $ref: '#/components/schemas/View'
    View:
      type: object
      additionalProperties: false
      description: >-
        One board a caller may open and the gestures it draws. It exists so a
        client can READ the surface instead of being told it in a description,
        which is how the two drifted apart in the first place.
      required: [name, gestures]
      properties:
        name:
          type: string
        gestures:
          type: array
          items:
            type: string
    CarryReport:
      type: object
      additionalProperties: false
      x-go-type: boardservice.CarryReport
      x-go-type-import:
        path: github.com/aenix-io/aeman/pkg/boardservice
      required: [carried, reseeded]
      properties:
        carried:
          type: integer
          description: >-
            The open plan cards from earlier weeks — the debts now showing on
            the target week's panel. They are not moved.
        reseeded:
          type: integer
    TaskRef:
      type: object
      additionalProperties: false
      required: [uid]
      properties:
        uid:
          type: string
    CreateCardRequest:
      type: object
      description: >-
        The card a board makes. Every field is optional here because what a
        board REQUIRES and what it refuses are the board's own rules, answered
        as a 422 that names the field.
      properties:
        title:
          type: string
        team:
          type: string
        zone:
          type: string
          enum: ["", urgent, unplanned, planned, niceToHave]
        size:
          type: string
          description: S, M, L or XL in any case; empty leaves the card unsized.
        assignees:
          type: array
          description: Only the first is read — a card is one person's.
          items:
            type: string
        dates:
          $ref: '#/components/schemas/CardDatesInput'
        week:
          type: string
          description: >-
            Schedules the card for a WEEK (its Monday) instead of a day: no
            dates are set and no sprint is joined.
        parked:
          type: boolean
          description: >-
            Puts the card straight on its team's shelf. Like `week`, no dates
            are set and no sprint is joined.
        epic:
          type: string
          description: >-
            With `project`, files the card on the Project board under the column
            that pair identifies. Its row is the week of `dates.start` — `week`
            anchors it when there are no dates — and the dates may span weeks.
        project:
          type: string
        reviewOf:
          type: string
        parent:
          type: string
          description: >-
            Groups the card as a subtask. A `parent` and a `week` together are
            refused (422): grouping hands the week to the parent, so the pair
            asks for two contradictory things.
        startNewSprint:
          type: boolean
        noSprint:
          type: boolean
          description: >-
            Schedules the card for its day without joining any sprint — a "next
            sprint" create; the next carry-over to reach its day adopts it.
    CardDatesInput:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        sprint:
          type: string
    CardPatch:
      type: object
      description: >-
        Only present fields are applied, so absent and empty are different
        things: empty clears.
      properties:
        title:
          type: string
        description:
          type: string
        team:
          type: string
        zone:
          type: string
          enum: ["", urgent, unplanned, planned, niceToHave]
        size:
          type: string
          description: S, M, L or XL in any case; empty takes the size back.
        assignees:
          type: array
          items:
            type: string
        progress:
          type: integer
        stage:
          type: string
          enum: ["", locked, review, recurrent, refuse, done]
          description: >-
            A name the board does not have is refused rather than stored.
            "done" clears the stage and fills 100; review and locked clamp the
            progress into [10, 90].
        recurrence:
          type: string
        epic:
          type: string
          description: >-
            The two halves of the card's column; empty clears. Epic names repeat
            across projects, so filing into another project's column names both,
            while naming only the epic stays inside the card's project.
        project:
          type: string
        dates:
          $ref: '#/components/schemas/CardDatesPatch'
        week:
          type: string
          description: >-
            The week the card is scheduled for; empty takes it off the weeks.
            Giving a STANDING subtask a week pulls it out of its group first —
            that is what the request means — while clearing one is free.
        parked:
          type: boolean
        reviewOf:
          type: string
        parent:
          type: string
          description: Groups the card under another one; empty ungroups.
        process:
          type: string
          description: >-
            Ties the card to an existing process — the recurring shelf's
            counterpart of a column; empty clears. The process must live in the
            card's own repository; only a RECURRENT card takes a tie, and a
            process TURN is refused outright, since a turn's process is its
            task's.
    CardDatesPatch:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        sprint:
          type: string
    RemoveCardBody:
      type: object
      properties:
        intent:
          type: string
          description: >-
            "unassign", "off-board", or left out for the gesture to decide for
            itself. Anything else is refused (400).
    PlaceCardBody:
      type: object
      properties:
        week:
          type: string
          description: The Monday of the week the card is placed in.
    MoveCardBody:
      type: object
      properties:
        after:
          type: string
          description: The card to land behind; empty means the top.
        before:
          type: string
          description: The card to land in front of. It wins when both are sent.
    DeferCardBody:
      type: object
      properties:
        days:
          type: integer
          description: How many days ahead of today the card is pushed; must be positive.
    SendToReviewBody:
      type: object
      properties:
        reviewer:
          type: string
        day:
          type: string
        zone:
          type: string
          enum: ["", urgent, unplanned, planned, niceToHave]
          description: >-
            Where the review card stands; empty is the unplanned band, which is
            where the asking belongs.
    PlacementBody:
      type: object
      description: >-
        A column, named by its EPIC. The project half may be empty — the
        no-project bucket is a column like any other, and a column's repository
        is read off the column's own stub.
      required: [epic]
      properties:
        project:
          type: string
        epic:
          type: string
    NoteBody:
      type: object
      properties:
        text:
          type: string
    SprintPatch:
      type: object
      properties:
        team:
          type: string
        current:
          type: string
        previous:
          type: string
        domain:
          type: string
          description: >-
            The repository a NEW team is declared in; an existing team's pointer
            stays where the team is.
    PersonPatch:
      type: object
      required: [capacity]
      properties:
        capacity:
          type: integer
          description: >-
            The points a week; 0 takes a set number back. It is required — a
            body without it is refused (400) rather than read as zero.
    CarryOverBody:
      type: object
      properties:
        team:
          type: string
        dryRun:
          type: boolean
          description: Report the counts and change nothing.
    ReorderTeamsBody:
      type: object
      properties:
        teams:
          type: array
          items:
            type: string
    TeamBody:
      type: object
      properties:
        team:
          type: string
    AddEpicBody:
      type: object
      properties:
        name:
          type: string
        project:
          type: string
    EpicBody:
      type: object
      properties:
        epic:
          type: string
        project:
          type: string
    ReorderEpicsBody:
      type: object
      properties:
        project:
          type: string
        epics:
          type: array
          items:
            type: string
    SetEpicProjectBody:
      type: object
      properties:
        epic:
          type: string
        from:
          type: string
          description: The project the column is leaving.
        project:
          type: string
          description: The project it joins; empty detaches it.
    RenameEpicBody:
      type: object
      properties:
        project:
          type: string
        epic:
          type: string
        to:
          type: string
    AddProcessBody:
      type: object
      properties:
        name:
          type: string
        project:
          type: string
        domain:
          type: string
          description: >-
            The repository to declare a project-less process in; one with a
            project lives with the project.
    ProcessBody:
      type: object
      properties:
        process:
          type: string
    RenameProcessBody:
      type: object
      properties:
        process:
          type: string
        to:
          type: string
    SetProcessProjectBody:
      type: object
      properties:
        process:
          type: string
        project:
          type: string
    SetProcessPausedBody:
      type: object
      properties:
        process:
          type: string
        paused:
          type: boolean
    ReorderProcessesBody:
      type: object
      properties:
        processes:
          type: array
          items:
            type: string
    ReorderProcessTasksBody:
      type: object
      properties:
        process:
          type: string
        uids:
          type: array
          items:
            type: string
    TaskRequest:
      type: object
      description: >-
        A task on the wire, for the create (which reads every field) and the
        patch (which applies only the present ones).
      properties:
        process:
          type: string
        title:
          type: string
        description:
          type: string
        recurrence:
          type: string
        start:
          type: string
        team:
          type: string
        assignee:
          type: string
        accumulate:
          type: boolean
    DeadlineBody:
      type: object
      properties:
        week:
          type: string
        project:
          type: string
    MoveDeadlineBody:
      type: object
      properties:
        project:
          type: string
        from:
          type: string
        to:
          type: string
    AddProjectBody:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
          description: The repository to declare the project in; empty is the primary.
    ProjectBody:
      type: object
      properties:
        project:
          type: string
    ReorderProjectsBody:
      type: object
      properties:
        projects:
          type: array
          items:
            type: string
    RenameProjectBody:
      type: object
      properties:
        project:
          type: string
        to:
          type: string
    RenameTeamBody:
      type: object
      properties:
        team:
          type: string
        to:
          type: string
    TeamCapacityBody:
      type: object
      required: [points]
      properties:
        team:
          type: string
        points:
          type: integer
          description: >-
            The points a week; 0 takes the number back. It is required — a body
            without it is refused (400) rather than read as zero.
    PresenceBody:
      type: object
      properties:
        card:
          type: string
          description: The card the caller has selected; empty clears the mark.
    WatchFrame:
      description: >-
        One frame of the watch stream. No operation references it — a WebSocket
        upgrade has no response body to describe — but a client applying the
        stream needs the shapes, so they are stated here.
      oneOf:
        - $ref: '#/components/schemas/CardFrame'
        - $ref: '#/components/schemas/SprintFrame'
        - $ref: '#/components/schemas/OrderingFrame'
        - $ref: '#/components/schemas/PresenceFrame'
        - $ref: '#/components/schemas/BoardFrame'
        - $ref: '#/components/schemas/LoadFrame'
        - $ref: '#/components/schemas/SyncFrame'
        - $ref: '#/components/schemas/QueueFrame'
        - $ref: '#/components/schemas/SyncErrorFrame'
    CardFrame:
      type: object
      description: >-
        A card changed. On a SCOPED subscription the verb is about the
        SELECTION: a card entering it arrives as ADDED and one leaving it as
        DELETED, whatever became of the card itself.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [ADDED, MODIFIED, DELETED]
        kind:
          type: string
          enum: [Card]
        object:
          $ref: '#/components/schemas/Card'
    SprintFrame:
      type: object
      description: >-
        A team's sprint pointer moved. It is shaped exactly as the listing
        shapes it, because a client merges the frame into what it holds: a field
        the frame left out would be a field the client LOSES.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Sprint]
        object:
          $ref: '#/components/schemas/Sprint'
    OrderingFrame:
      type: object
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Ordering]
        object:
          $ref: '#/components/schemas/Ordering'
    PresenceFrame:
      type: object
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Presence]
        object:
          $ref: '#/components/schemas/Presence'
    Presence:
      type: object
      additionalProperties: false
      description: One person's live selection.
      required: [login, card]
      properties:
        login:
          type: string
        card:
          type: string
    BoardFrame:
      type: object
      description: >-
        The board's STRUCTURE changed — a project, a column, a deadline, a
        process or one of its tasks. It carries the whole board resource plus
        the process structure, so a client applies it without a round trip, and
        it is coalesced for a burst of writes.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Board]
        object:
          type: object
          additionalProperties: false
          description: >-
            The board resource with the process structure beside it. Stated
            field by field rather than composed out of Board: a closed schema
            cannot be extended by an allOf, and the closure is what catches a
            field added in Go without a line here.
          required: [kind, metadata, processes]
          properties:
            kind:
              type: string
              enum: [Board]
            metadata:
              $ref: '#/components/schemas/BoardMetadata'
            processes:
              type: array
              items:
                $ref: '#/components/schemas/Process'
    LoadFrame:
      type: object
      description: >-
        What the board's PEOPLE are holding. Those numbers are summed over cards
        from every team, so a client holding one view's cards can neither
        compute them nor learn them from the card events it receives. Shaped as
        `metadata.members`, to be merged in place.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Load]
        object:
          type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    SyncFrame:
      type: object
      description: The board cache was reloaded; the moment it now reflects.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Sync]
        object:
          type: object
          required: [loadedAt]
          properties:
            loadedAt:
              type: string
    QueueFrame:
      type: object
      description: How many writes are still unsynced; the UI hides the number at zero.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Queue]
        object:
          type: object
          required: [pending]
          properties:
            pending:
              type: integer
    SyncErrorFrame:
      type: object
      description: >-
        A write was lost after its retries. Nobody is spared this one — the
        client that made the change needs the rollback most of all.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [ERROR]
        kind:
          type: string
          enum: [SyncError]
        object:
          type: object
          required: [message]
          properties:
            message:
              type: string
