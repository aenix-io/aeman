          type: array
          items:
            type: string
        progress:
          type: integer
          description: >-
            0..100. The service clamps rather than refuses: review and locked
            hold it inside [10, 90], and done fills it.
        stage:
          type: string
          description: >-
            An explicit status that recolours the bar: locked, review,
            recurrent, refuse — or absent, the implicit in-progress state. Done
            is DERIVED (`status.complete`): 100% with no stage. `refuse` is the
            answer of the person the card is on, so only they may set it (403
            otherwise); it does not take the card off anyone's board, it leaves
            it standing for their lead to answer, and clearing it IS that
            answer, which anyone may do. A review card takes neither review nor
            recurrent (422). Taking a card off review cancels its unfinished
            linked review card, unless the reviewer has already worked on it.
        recurrence:
          type: string
          description: >-
            A recurrent card's reseed cycle: absent is every sprint, "week" and
            "month" once the interval has elapsed.
        dates:
          $ref: '#/components/schemas/CardDates'
        week:
          type: string
          description: >-
            The week a card with no dates is scheduled for, a Monday: its column
            on the Triage board. Any other day is refused (422) — a column IS a
            Monday. A slot's row is the week of its `dates.start`, always
            derived, so setting a week on a card filed under a column is refused
            too, though re-asserting the week it already derives is a harmless
            no-op. A process TURN keeps to its own occurrence.
        parked:
          type: boolean
          description: >-
            The card is on its team's SHELF rather than in the plan — work
            somebody has read and put aside. Exclusive with `week`: setting one
            clears the other, at every door. Parking empties the working area,
            takes the card's subtasks off the board with it, withdraws any
            unfinished review of it, and puts it at the top of the shelf. Every
            team has a shelf and nothing declares it. A Project-board slot, a
            process turn, a review card and a subtask are refused (422): none of
            them has a place of its own to be parked out of.
