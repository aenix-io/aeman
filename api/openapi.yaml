openapi: 3.0.3
info:
  title: aeman
  version: "1"
  description: >-
    The REST surface of one aeman board. Resources are Kubernetes-style —
    {kind, metadata, spec, status} — and everything with board-level rules is an
    action: a client states intent and the server applies the rules. A write
    that leaves nothing to show answers 204; every refusal is an RFC 9457
    problem whose `code` names the rule.


    A request schema says the SHAPE of a body, not what a call needs. What a
    board REQUIRES is the board's own rule — it depends on the board the call
    was made through, and it is answered as a refusal naming the field — so
    almost every request schema here marks nothing as required. The few that
    do are the fields a call means nothing without: a capacity's number.


    Three headers belong to the middleware and are described here rather than
    declared on an operation: `X-Aeman-Client` on a request keys echo
    suppression on the watch, `X-Aeman-As-Of` says the caller is looking at a
    past day, which refuses a WRITE to a card that day is over for, and
    `X-Aeman-Stale` rides a READ answered from a cache being revalidated. They
    are the middleware's, so no operation declares them.
servers:
  - url: /api/v1
tags:
  - name: Board
    description: The board itself — its roster, its boards, and the stream of what changes.
  - name: Cards
    description: Cards, the gestures a board draws on them, and what they carry.
  - name: Notes
    description: A card's work notes.
  - name: Sprints
    description: Per-team sprint pointers and the carry-over.
  - name: Customers
    description: Who the work is for — the board's customer roster.
  - name: Teams
    description: Team names and what a team gets through in a week.
  - name: Presence
    description: Who is looking at what, right now.
  - name: Meta
    description: The description of this surface.
paths:
  /board:
    get:
      operationId: getBoard
      tags: [Board]
      summary: >-
        The board: title, the team roster, the people and the visitor's
        domains.
      description: >-
        The board is the one the server was started with — there is no
        addressing parameter. Ask
        it with the same day selector as the listing beside it: a past day's
        SPRINT POINTERS come with that day's cards, and today's pointers over
        that day's cards drop nearly all of them.
      parameters:
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/BoardOfView'
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        default:
          $ref: '#/components/responses/Problem'
  /views:
    get:
      operationId: listViews
      tags: [Board]
      summary: The boards a caller may open, each with the gestures it draws.
      responses:
        '200':
          description: The catalog of boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewList'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards:
    get:
      operationId: listCards
      tags: [Cards]
      summary: List the cards that board draws, in board order.
      description: >-
        A listing is the board-ROW shape: no `spec.description` — `status.links`
        carries the refs extracted from it — and the body itself is one
        GET /cards/{uid} away. `fields=full` opts a genuine bulk reader into
        complete cards. Every listing is the visitor's projection: cards in
        domains they cannot read are not there.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: What that board draws.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCard
      tags: [Cards]
      summary: Create the card that board makes.
      description: >-
        A create means what the board means by it: typed into `me` the card is
        yours, today, in the sprint and in the unplanned band; into `team` it
        lands in the Unassigned column unless somebody is named; into `backlog`
        it is parked in the team's backlog, last — or right where `after` /
        `before` place it, in the same request; into `roadmap` it is a goal, an initiative or an epic,
        or a task under one — parked in the no-team group's backlog when it
        was given no dates. Each board refuses
        the fields it does not own — a parked card typed into a day, a type
        named on the Me board — with a 422 that says which field it was. A title
        that is nothing but a GitHub issue/PR URL becomes that item's real
        title, with the link moved into the description.
      parameters:
        - $ref: '#/components/parameters/View'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: The card as it was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/watch:
    get:
      operationId: watchView
      tags: [Board]
      summary: Watch that board over a WebSocket.
      description: >-
        An upgrade, not a response: each text frame that follows is one
        `#/components/schemas/WatchFrame`. With the narrowing parameters the
        subscription is SCOPED — a card entering the selection arrives as ADDED
        and one leaving it as DELETED — while `view=all` with no selectors is
        the raw board stream. `resources` picks the kinds and `client` keys echo
        suppression: a change made with the same `X-Aeman-Client` is not
        streamed back on that connection.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
        - name: resources
          in: query
          required: false
          description: >-
            A comma-separated set of the kinds to receive; the default is
            cards,sprints,ordering,presence.
          schema:
            type: string
        - name: client
          in: query
          required: false
          description: The client id changes are attributed to, for echo suppression.
          schema:
            type: string
      responses:
        '101':
          description: Switching to the WebSocket stream.
  /views/{view}/cards/{uid}/actions/remove:
    post:
      operationId: removeCard
      tags: [Cards]
      summary: The board's × — take the card out of work, or delete it by that board's rules.
      description: >-
        `intent` says which of the ×'s two meanings is wanted: `unassign`
        takes the card out of work and puts it back in its team's BACKLOG —
        parked, no person, no day, no sprint (a subtask is pulled out of its
        group first; on a review card it is "back to backlog": the reviewer
        is taken off and the review waits, parked with nobody on it, at the
        top of the reviewed task's team backlog while the task stays on
        review) —
        and `off-board` takes it away with the subtasks that were pieces of
        it. Omitted, the gesture decides for itself. On a
        review card — whether a reviewer has it or nobody has taken it —
        `off-board` and no intent WITHDRAW the review: the reviewed task
        goes back to In progress and the review card goes.


        From the Me board the × is the narrow one: a person takes off their own
        board what they PUT there and what the plan has not taken up. Work
        another person scheduled for them, or work they scheduled on the Team
        board, is somebody's plan and is refused there (403) — the wide ×
        lives on the board where the planning was done, and the answer to "I am
        not doing this" is `spec.stage: refuse`. A card with no recorded author
        is not exempt, and a subtask is outside the rule.


        Asked nothing, the × empties the WORKING AREA, which was the card's
        only home, and so deletes it. It takes the card's subtasks with it. A deleted
        card is not lost to the board's history: the day it stood on gives it
        back. DELETE /cards/{uid} is the deliberate delete, and it FREES a
        card's subtasks rather than taking them along.


        A second, wider rule sits in front of both doors, this one and
        DELETE /cards/{uid}: a card the caller is CARRYING but did not create
        is not theirs to take off the board, on ANY board (403). Their answer
        to work somebody else planned for them is `spec.stage: refuse`, which
        leaves the card standing for the person who planned it to decide.
        Unlike the Me-board rule above, a card with no recorded author is
        outside this one — there is nobody else it could belong to — and so
        are a subtask and a review card, which are pieces of other work rather
        than work assigned to anyone.


        A client should ask before pressing it when there is progress or a
        linked review card to lose: the server does not ask, and what the card
        carries does not change what the gesture does.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCardBody'
      responses:
        '204':
          description: The card is off that board.
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards/{uid}/actions/own:
    post:
      operationId: ownCard
      tags: [Cards]
      summary: Whose is this — a team and a person on it, a team alone, or nobody.
      description: >-
        The Roadmap's answer for the loose work listed below its tree, offered
        by every board that draws a task. What the
        answer DOES depends on whether the card is in work — a date or a
        sprint. A `person` (with their `team`) takes an UNPLANNED card into
        work the way typing it into their Me board would: on the team, today,
        in the unplanned band, in the team's sprint, out of its backlog — so it
        stands on their Team and Me boards at once; a planned card changes
        hands and keeps its plan. A `team` alone parks an unplanned card in
        that team's backlog with nobody on it (a parked card handed to another
        team stays parked); a planned card moves team, keeps its plan and
        loses its person. Neither takes the team and the person off: a
        planned card keeps its plan in the no-team group, an unplanned one is
        parked in the no-team group's backlog. A person without a team
        is refused (422 `ownerNeedsTeam`); a subtask and a review card have
        no owner of their own (422 `ownerFollowsLink` — the parent's, the
        reviewer) — except a review NOBODY HAS TAKEN, where a person is its
        reviewer and takes it into work like a task (today, the task's sprint,
        out of the backlog).
        On a goal, an initiative or an epic the answer is the card's TEAM (the
        team that carries it out) and its OWNER (the one person who answers
        for it): a person needs no team there, a person alone keeps the
        card's team and a team alone keeps its owner, neither takes both off
        (a PATCH with `team` or `owner` empty takes one half off alone), and
        nothing about it reaches a day board. Subtasks follow the card's team
        and person, as they do everywhere.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards/{uid}/actions/take:
    post:
      operationId: takeCard
      tags: [Cards]
      summary: The Backlog's "I take this into work" — the card becomes the caller's.
      description: >-
        Offered by the backlog view (and `all`). The caller — the signed-in
        person, the identity every write records as its author — gets the card
        on its OWN team (a card of the no-team group stays in it): a parked
        task is taken into work as `own` with a person takes it — today, the
        unplanned band, the team's sprint, out of the backlog — and a review
        nobody has taken makes the caller its reviewer. Refused where there is
        nothing to take: a planning card (422 `planningCard`), a subtask or a review somebody already
        has (422 `ownerFollowsLink`), finished work (422 `alreadyFinished`), a
        task already in work (422 `alreadyInWork` — hand it over with `own`),
        a parked card somebody else is named on (422 `somebodysCard`), and a
        request that names nobody (422 `nobodyToTake`).
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /views/{view}/cards/{uid}/actions/finished-earlier:
    post:
      operationId: finishedEarlier
      tags: [Cards]
      summary: A day board's answer for work done in the sprint before this one and marked done now.
      description: >-
        It sends finished work back to the sprint it was done in, its dates and
        the day it counts as done along with it. A MOVE rather than a removal,
        which is why it has a door of its own.
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/User'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Stage'
        - $ref: '#/components/parameters/Zone'
        - $ref: '#/components/parameters/Focus'
        - $ref: '#/components/parameters/Reviews'
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Snapshot'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}:
    get:
      operationId: getCard
      tags: [Cards]
      summary: One card in full — the body lives here, not in listings.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchCard
      tags: [Cards]
      summary: Edit spec fields; only present fields apply, and an empty value clears.
      description: >-
        The server applies the rules as the UI would: the clamps, the review
        linkage, the calendar semantics of the dates. Fields are applied in the
        order the handler reads them, and the assignees last — ungrouping hands
        an ownerless child its parent's person, and a patch that also names
        assignees means the caller decided who owns it.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCard
      tags: [Cards]
      summary: Hard delete, cascading to the linked review card.
      description: >-
        The deliberate delete — "this card is a mistake" — as against the
        board's ×, which is "this work is off the board". It FREES the card's
        subtasks into standalone cards rather than taking them along. A card
        the caller is CARRYING but did not create is refused here as it is at
        the × (403): `spec.stage: refuse` is the answer to work somebody else
        planned. A subtask, a review card and a card with no recorded author
        are outside that rule. Deleting a REVIEW card withdraws the review:
        the reviewed task goes back to In progress, since no door leaves a
        task on review with no review card.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: The card is gone.
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/move:
    post:
      operationId: moveCard
      tags: [Cards]
      summary: Reorder the card after (or before) another one.
      description: >-
        `before` wins when both are sent; an empty `after` puts the card at the
        top.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCardBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/defer:
    post:
      operationId: deferCard
      tags: [Cards]
      summary: Push the scheduled day N days ahead of today.
      description: >-
        Presses stack, and a card created today relocates fully. `days` must be
        positive — putting work OFF is the whole gesture — and a zero or
        negative one is 422.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferCardBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/in-progress:
    post:
      operationId: setInProgress
      tags: [Cards]
      summary: Move the card to the implicit In Progress status.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/reopen:
    post:
      operationId: reopenCard
      tags: [Cards]
      summary: Undo a done mark, restoring the progress the card had when done was set.
      description: >-
        The stage clears and the progress returns to what the card carried when
        it was marked done, the jump recorded in its log; with no history to
        read it falls back to In Progress.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/send-to-review:
    post:
      operationId: sendToReview
      tags: [Cards]
      summary: Send the card to a reviewer, or reassign the review that exists.
      description: >-
        The answer is the REVIEW card, whether it was created or reassigned. A
        reviewer who cannot read the card's repository cannot see the review
        either — it lives with the card it reviews — which is what
        `domains[].members` is for: a client narrows its picker by it. Without a `zone` the
        review lands in the unplanned one: for the reviewer it is work that
        turned up during their day, and the original's band says where the WORK
        stood, not where the asking belongs.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendToReviewBody'
      responses:
        '201':
          description: The review card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/remove-reviewer:
    post:
      operationId: removeReviewer
      tags: [Cards]
      summary: Take the reviewer off the card.
      description: >-
        While the card is on review the review is still asked for: its review
        card goes back to the task's team backlog with nobody on it, at the
        top. A finished review, or one of a card no longer on review, is
        deleted.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/priority:
    post:
      operationId: setPriority
      tags: [Cards]
      summary: Set the card's own priority — P0 to P4, or none.
      description: >-
        The Roadmap's badge menu. Any card carries a priority: a task, a goal,
        an initiative, an epic. What a card counts under is its EFFECTIVE
        priority (`status.effectivePriority`): its own, else the nearest
        ancestor's that has one — so a plan item's priority reaches every
        card under it with none of its own, without being written on them.
        A backlog reads P0 first, then P1, P2, P3, P4, then none, each in the
        Roadmap's order. An empty value clears the card's own. Nothing
        clears it on its own: taking the card into work, finishing it and
        reopening it keep it. Anything but P0, P1, P2, P3, P4 or empty is
        422 `badPriority`.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPriorityBody'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/actions/unassign-work:
    post:
      operationId: unassignWork
      tags: [Cards]
      summary: Take work in hand out of work, back to its team's backlog.
      description: >-
        The Roadmap's status menu, UNASSIGNED. On a TASK it takes the task
        itself, which must be open work in hand — a date or a sprint, not
        parked, not finished (422 `notInWork` otherwise). On a PLAN ITEM it
        takes every such task under it, at any depth. Each goes the way the
        ×'s unassign sends a card (K3): nobody on it, no day, no sprint, its
        unfinished review withdrawn, parked in the backlog of the team it
        stands under, where it stands in the board's order. Finished work,
        review cards and subtasks are never touched. Every task is checked
        first — reachable from the card, and the caller's to write (403
        naming how many and which otherwise) — and the request is applied
        whole or not at all, in one commit per repository it touches.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignWorkBody'
      responses:
        '200':
          description: How many tasks went back to their backlog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkChange'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/links:
    get:
      operationId: listLinks
      tags: [Cards]
      summary: The URLs found in the card's description, GitHub refs resolved and listed first.
      description: >-
        Only github.com references are recognised; GitLab issue and
        merge-request links are plain links for now.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card's links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkList'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/log:
    get:
      operationId: getCardLog
      tags: [Cards]
      summary: The card's activity feed — recorded events and work notes, one chronological list.
      description: >-
        Read from the repository's history: every commit that touched the card
        is one or more events, with the commit's author and time, merged with
        its notes. A change made by a direct git write shows up like any other.
        This is one card's whole history; for a day's feed across many cards ask
        GET /logs.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The card's feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        default:
          $ref: '#/components/responses/Problem'
  /logs:
    get:
      operationId: getDayLogs
      tags: [Cards]
      summary: One day's feed for many cards at once — what a day board shows.
      description: >-
        The history walk stops at the day's first moment, so this costs a
        fraction of a log per card: asking a whole log per card is what made a
        board open fire dozens of slow requests. A card that was quiet that day
        is present with an empty list; a card the visitor cannot read is absent.
      parameters:
        - name: day
          in: query
          required: false
          description: The board day to read, yyyy-mm-dd. Empty or absent is today.
          schema:
            type: string
            pattern: '^(\d{4}-\d{2}-\d{2})?$'
        - name: uids
          in: query
          required: false
          description: The cards to read, comma-separated; at most 200 per request.
          schema:
            type: string
      responses:
        '200':
          description: That day, per card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLogList'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/notes:
    get:
      operationId: listNotes
      tags: [Notes]
      summary: The card's work notes.
      parameters:
        - $ref: '#/components/parameters/Uid'
      responses:
        '200':
          description: The thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addNote
      tags: [Notes]
      summary: Append a work note.
      description: >-
        Every note mutation answers the card's whole thread, so clients converge
        on the server's view of it rather than on their own idea of the order.
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteBody'
      responses:
        '201':
          description: The thread with the new note in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
  /cards/{uid}/notes/{noteId}:
    patch:
      operationId: editNote
      tags: [Notes]
      summary: Edit a work note.
      parameters:
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteBody'
      responses:
        '200':
          description: The thread after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteNote
      tags: [Notes]
      summary: Delete a work note.
      parameters:
        - $ref: '#/components/parameters/Uid'
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: The thread the note has left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        default:
          $ref: '#/components/responses/Problem'
  /sprints:
    get:
      operationId: listSprints
      tags: [Sprints]
      summary: Per-team sprint pointers.
      description: >-
        Ask it with the same day selector as the listing beside it: a past day's
        pointers come with that day's cards, and the client's own view rules
        compare a card's sprint against them.
      parameters:
        - $ref: '#/components/parameters/Day'
        - $ref: '#/components/parameters/Snapshot'
        - $ref: '#/components/parameters/BoardOfView'
      responses:
        '200':
          description: The pointers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintList'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchSprint
      tags: [Sprints]
      summary: Set a team's sprint pointer directly.
      description: >-
        A team is declared by its first sprint write, in the `domain` the caller
        picks; an existing team's pointer stays where the team is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprintPatch'
      responses:
        '200':
          description: The pointer as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        default:
          $ref: '#/components/responses/Problem'
  /people/{login}:
    patch:
      operationId: patchPerson
      tags: [Board]
      summary: Set the points a week a PERSON gets through.
      description: >-
        The number a day board measures their load against. 0 takes a set number
        back and nothing derives one; outside 0..999, or a login that could not
        be one, is 422. It answers the whole Board resource, whose members carry
        `load` and `capacity` — that is what the client redraws.
      parameters:
        - $ref: '#/components/parameters/Login'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonPatch'
      responses:
        '200':
          description: The board, with the person's new number in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        default:
          $ref: '#/components/responses/Problem'
  /sprints/actions/carry-over:
    post:
      operationId: carryOver
      tags: [Sprints]
      summary: Advance a team's sprint to today and carry its unfinished cards.
      description: >-
        Finished recurrent cards reseed as fresh copies. With `dryRun` the
        counts are reported and nothing changes, which is what backs a confirm
        dialog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarryOverBody'
      responses:
        '200':
          description: What was carried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarryReport'
        default:
          $ref: '#/components/responses/Problem'
  /sprints/actions/reorder-teams:
    post:
      operationId: reorderTeams
      tags: [Sprints]
      summary: Apply a shared team order.
      description: >-
        The hidden sprint-state cards are moved into the given sequence, so
        every client reads the same order back from the board metadata. Teams
        missing from the list keep their positions after the reordered ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTeamsBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /sprints/actions/delete-team:
    post:
      operationId: deleteTeam
      tags: [Sprints]
      summary: Delete a team's sprint pointer; refused while cards still use the team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamBody'
      responses:
        '204':
          description: The team is gone from the roster.
        default:
          $ref: '#/components/responses/Problem'
  /customers:
    post:
      operationId: addCustomer
      tags: [Customers]
      summary: Add a customer to the board's roster, last.
      description: >-
        Cards name a customer by its id (spec.customers), so the name can be
        changed later and every card follows. A name the roster already has,
        case aside, is 422 `customerExists`; an empty one 422 `customerName`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerBody'
      responses:
        '201':
          description: The customer as it was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRef'
        default:
          $ref: '#/components/responses/Problem'
  /customers/actions/rename:
    post:
      operationId: renameCustomer
      tags: [Customers]
      summary: Rename a customer; every card that names it reads the new name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCustomerBody'
      responses:
        '204':
          description: The customer is renamed.
        default:
          $ref: '#/components/responses/Problem'
  /customers/actions/reorder:
    post:
      operationId: reorderCustomers
      tags: [Customers]
      summary: Apply the roster's order — the ids named first, in that order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCustomersBody'
      responses:
        '204':
          description: The order is applied.
        default:
          $ref: '#/components/responses/Problem'
  /customers/actions/delete:
    post:
      operationId: deleteCustomer
      tags: [Customers]
      summary: Delete a customer and take it off every card that names it.
      description: >-
        Needs the right to write the roster (the primary repository) and
        every repository holding a card that names the customer; otherwise
        403 and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBody'
      responses:
        '204':
          description: The customer is gone, from the roster and from every card.
        default:
          $ref: '#/components/responses/Problem'
  /teams/actions/rename:
    post:
      operationId: renameTeam
      tags: [Teams]
      summary: Rename a team in place, its cards along with it.
      description: >-
        Its declaration keeps its sprint pointer. A name another team has is
        refused (422), and the no-team group cannot be renamed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTeamBody'
      responses:
        '204':
          description: The team is renamed.
        default:
          $ref: '#/components/responses/Problem'
  /teams/actions/capacity:
    post:
      operationId: setTeamCapacity
      tags: [Teams]
      summary: Set the points a week a team gets through.
      description: >-
        The number a week of the team's plan is weighed against, stored in the
        team's own file. 0 takes it back and the board derives none; outside
        0..999 is 422, and so is a team the board does not declare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCapacityBody'
      responses:
        '204':
          description: The number is recorded.
        default:
          $ref: '#/components/responses/Problem'
  /presence:
    post:
      operationId: setPresence
      tags: [Presence]
      summary: Share the caller's live card selection; an empty card clears it.
      description: >-
        Ephemeral shared-cursor state, broadcast over the watch and never
        persisted. The login is the caller's authenticated identity, not a
        client-supplied value, and the client id (`X-Aeman-Client`) keys it, so
        a closed tab clears its own mark and a lead and a person each have
        their own. A selection is board-wide, not a view's: one made on the
        Team board reaches a Me board's watch and the other way round. A
        watcher who may not read the card's repository is sent the mark as
        cleared, never the card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceBody'
      responses:
        '204':
          description: The selection is shared.
        default:
          $ref: '#/components/responses/Problem'
  /openapi.json:
    get:
      operationId: getOpenAPI
      tags: [Meta]
      summary: This document, as JSON.
      responses:
        '200':
          description: The OpenAPI description of this surface.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Uid:
      name: uid
      in: path
      required: true
      description: The card's own address, a ULID assigned at creation.
      schema:
        type: string
    View:
      name: view
      in: path
      required: true
      description: >-
        The board the caller is standing on: me, team, backlog, roadmap, or
        all — the escape hatch, which has to be said out loud. A board nobody
        has is a route that is not there (404) — `triage`, the retired Triage
        board, and `project`, the retired Project board, among them. The
        backlog lists each named team's parked open tasks in the order the backlog is read (by hand, then
        oldest first). The roadmap lists
        the hierarchy — every goal, initiative and epic, and every card with one
        above it — and a create there is a planning card (`type` required).
      schema:
        type: string
    NoteId:
      name: noteId
      in: path
      required: true
      description: The note's id inside the card.
      schema:
        type: string
    Login:
      name: login
      in: path
      required: true
      description: The person's forge login.
      schema:
        type: string
    Team:
      name: team
      in: query
      required: false
      description: >-
        A comma-separated set of team keys; the listings union them. A task
        is placed by the team it stands under: its own, else the nearest
        ancestor's (ownership.md, O13). The
        no-team group is the empty member — `alpha,` is alpha and the no-team
        group, `,` the no-team group alone. Left empty it means, per view: on
        `team`, the no-team group's grid; on `backlog`, `me`, `all` and
        `roadmap`, no team filter (every team's). On the roadmap
        view it narrows by EFFECTIVE team: a task whose own or inherited team
        is among them (the no-team group: none at all), a planning card that
        is or has such a task under it, each with its ancestors.
      schema:
        type: string
    Day:
      name: day
      in: query
      required: false
      description: The day a day board is read for, yyyy-mm-dd. Empty or absent is today.
      schema:
        type: string
        pattern: '^(\d{4}-\d{2}-\d{2})?$'
    User:
      name: user
      in: query
      required: false
      description: >-
        Whose Me board to read. Who-am-I is resolved server-side, so a caller
        needs none; an explicit one wins, for a lead looking at somebody else's
        day.
      schema:
        type: string
    Assignee:
      name: assignee
      in: query
      required: false
      description: Keep only the cards on one person.
      schema:
        type: string
    Stage:
      name: stage
      in: query
      required: false
      description: >-
        Keep only the cards carrying one stage; present and empty means the
        cards carrying none.
      schema:
        type: string
    Zone:
      name: zone
      in: query
      required: false
      description: >-
        Keep only the cards in one band; present and empty means the cards in
        none. The filter reads the same answer the listing states, so the two
        never disagree about a card.
      schema:
        type: string
    Focus:
      name: focus
      in: query
      required: false
      description: >-
        "true" or "1" keeps only the cards workable right now — done, on-review
        and locked are dropped.
      schema:
        type: string
    Reviews:
      name: reviews
      in: query
      required: false
      description: >-
        "true" or "1" brings review cards into the view: on me and team each
        card's linked review is APPENDED. Off by default.
      schema:
        type: string
    Customer:
      name: customer
      in: query
      required: false
      description: >-
        A comma-separated set of customer ids, matched against a card's
        EFFECTIVE customers (its own plus every ancestor's). On the roadmap
        view a task is listed when one of them is among the set, a planning
        card when it is itself or any task under it is, each with its
        ancestors; with `team` and `owner`, AND. On the team, backlog, all
        and me views the cards listed are narrowed the same way, with the
        team set AND. Several values are OR.
      schema:
        type: string
    Owner:
      name: owner
      in: query
      required: false
      description: >-
        On the roadmap view, a comma-separated set of logins — the Roadmap's
        one person filter: a goal, an initiative or an epic is listed when its
        OWN owner is among them (never inherited), and a task or a subtask
        when one of its assignees is; each with its ancestors. A planning card
        also passes this filter by a task under it assigned to one of them.
        Several values are OR; with `team` and `customer`, AND.
      schema:
        type: string
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        The resource shape a listing delivers: "summary" (the default, a board
        row with no description) or "full". Anything else is refused (400).
      schema:
        type: string
    Snapshot:
      name: snapshot
      in: query
      required: false
      description: >-
        "true" or "1", with a PAST day on a me or team board: the board as it
        STOOD when that day ended, rather than today's cards filtered by that
        day's dates. Whether a day is over is asked per team. A day the clone's
        history no longer reaches is 410, and storage that keeps no history
        answers 501. Ignored where a board has no records to give.
      schema:
        type: string
    BoardOfView:
      name: view
      in: query
      required: false
      description: >-
        Which board is asking, for a read with no board segment of its own: only
        a DAY board has a day to be a record of, so the snapshot flag is ignored
        for the others.
      schema:
        type: string
  responses:
    Problem:
      description: >-
        The request was refused. The status says whose fault it was, `detail` is
        the sentence to show a person, and `code` is what a program branches on.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: An RFC 9457 problem detail, with two extension members.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          description: >-
            Always "about:blank": there is no page per problem, and `code`
            carries the identity.
        title:
          type: string
          description: The status code's own text.
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        detail:
          type: string
          description: The sentence to show a person.
        code:
          type: string
          description: >-
            The rule that refused, for a program to branch on. For a rule of the
            board it is that rule's own name.
          enum:
            - accessUndecided
            - alreadyFinished
            - alreadyInWork
            - authorizationExpired
            - backwardsDefer
            - badCapacity
            - badDay
            - badPriority
            - bodyTooLarge
            - capacityRequired
            - cardNotFound
            - cardNotOnBoard
            - crossDomain
            - crossSiteBlocked
            - customerExists
            - customerName
            - customerNotFound
            - dayIsARecord
            - descriptionTooLong
            - emptyNote
            - emptyTitle
            - endBeforeStart
            - forbidden
            - gestureNotOffered
            - historyTruncated
            - invalidAsOf
            - invalidBody
            - invalidDay
            - invalidParameter
            - invalidSelector
            - invalidStage
            - nameTaken
            - nobodyToTake
            - noEarlierSprint
            - noHistory
            - noPlaceOfItsOwn
            - noReviewer
            - noSuchView
            - notATarget
            - notAuthenticated
            - notFinished
            - notInWork
            - notOnThisBoard
            - notYoursToRefuse
            - notYoursToRemove
            - noteNotFound
            - noteTooLong
            - openSubtasks
            - ownerFollowsLink
            - ownerNeedsTeam
            - ownerIsThePlans
            - ownershipUnsupported
            - parentLevel
            - parentNotFound
            - planningCard
            - pointsRequired
            - reviewCardLink
            - setupRequired
            - somebodysCard
            - subtaskDepth
            - teamExists
            - teamInUse
            - takeIntoWork
            - teamNotFound
            - titleTooLong
            - tooManyCards
            - twoPlaces
            - unknownDomain
            - unknownIntent
            - unknownRoute
            - unknownSize
            - unknownStage
            - unknownType
            - unknownZone
            - upstreamFailed
            - viewNeedsField
        actionUrl:
          type: string
          description: >-
            Where the person can go to fix the refusal — installing the board's
            app — for a client to offer as a button.
    Card:
      type: object
      additionalProperties: false
      x-go-type: apiserver.Card
      x-go-type-import:
        path: github.com/aenix-io/aeman/pkg/apiserver
      required: [kind, metadata, spec, status]
      properties:
        kind:
          type: string
          enum: [Card]
        metadata:
          $ref: '#/components/schemas/CardMetadata'
        spec:
          $ref: '#/components/schemas/CardSpec'
        status:
          $ref: '#/components/schemas/CardStatus'
    CardMetadata:
      type: object
      additionalProperties: false
      x-go-type: apiserver.CardMetadata
      x-go-type-import:
        path: github.com/aenix-io/aeman/pkg/apiserver
      description: The card's identity and immutable facts.
      required: [uid]
      properties:
        uid:
          type: string
          description: >-
            A ULID, assigned at creation and never changed by a rename, a move
            or a re-filing. A card migrated from a GitHub Projects v2 board also
            answers to its old id for one major version.
        author:
          type: string
        createdAt:
          type: string
    CardSpec:
      type: object
      additionalProperties: false
      x-go-type: apiserver.CardSpec
      x-go-type-import:
        path: github.com/aenix-io/aeman/pkg/apiserver
      description: The user's intent — everything an edit can change.
      required: [title, assignees, progress, dates]
      properties:
        title:
          type: string
        description:
          type: string
          description: >-
            The card's body. ABSENT in a listing — that is the "not loaded"
            marker — and always present, possibly empty, on a full resource, so
            an empty body never reads as a missing one.
        team:
          type: string
          description: >-
            The card's own team. On a goal, an initiative or an epic it is the
            team that carries the plan item out: it places nothing, and the
            cards below take it as their effective team when they have none
            (status.effectiveTeam).
        owner:
          type: string
          description: >-
            The one person who answers for a goal, an initiative or an epic —
            breaks it down, keeps its status honest. Never inherited, and it
            puts nothing on any day board. Absent on every other card (a
            task's people are its assignees).
        customers:
          type: array
          description: >-
            Ids from the board's customer roster (`metadata.customers`) that
            this card itself names. The cards below add to them
            (status.effectiveCustomers).
          items:
            type: string
        zone:
          type: string
          description: >-
            The band the card stands in, by meaning rather than by colour. A
            card in the WORKING AREA — one carrying a sprint or dates of its own
            — always answers with a band: nobody having said means "planned",
            which is where every board draws it anyway. Absent is reserved for
            cards that are on no day (a parked task, a planning card), where "no band yet" is a state a client draws as one.
          enum: [urgent, unplanned, planned, niceToHave]
        size:
          type: string
          description: >-
            What somebody said the card weighs. The points a board sums are
            derived from it — S 1, M 2, L 4, XL 8 — never stored, and a card
            with SUBTASKS weighs their sum instead of its own size (the umbrella
            rule: a parent's estimate stands until its children exist, then they
            replace it, and nothing counts twice). A card nobody has sized
            weighs M — except a review card, which weighs S — and that default
            is what the SUMS use, never a value written to the card, so the
            field stays absent on it. A size the board does not know is answered
            as absent rather than echoed back.
          enum: [S, M, L, XL]
        assignees:
          type: array
          items:
            type: string
        progress:
          type: integer
          description: >-
            0..100. The service clamps rather than refuses: review and locked
            hold it inside [10, 90], and done fills it.
        stage:
          type: string
          description: >-
            Open on the way out, unlike the patch's closed `stage`: a card's
            stage is read verbatim from its file in the repository
            (pkg/gitstore/layout.go), which any tool may commit to, so this
            reports what the board says rather than what a write would have
            been allowed to set. An explicit status that recolours the bar:
            locked, review, recurrent, refuse — or absent, the implicit in-progress state. Done
            is DERIVED (`status.complete`): 100% with no stage. `refuse` is the
            answer of the person the card is on, so only they may set it (403
            otherwise); it does not take the card off anyone's board, it leaves
            it standing for their lead to answer, and clearing it IS that
            answer, which anyone may do. A review card takes neither review nor
            recurrent (422). Taking a card off review cancels its unfinished
            linked review card, unless the reviewer has already worked on it.
