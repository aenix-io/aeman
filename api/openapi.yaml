    CardDatesInput:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        sprint:
          type: string
    CardPatch:
      type: object
      description: >-
        Only present fields are applied, so absent and empty are different
        things: empty clears.
      properties:
        title:
          type: string
        description:
          type: string
        team:
          type: string
          description: >-
            A task's team; on a goal, an initiative or an epic the team that
            carries it out (it places nothing and joins no sprint).
        owner:
          type: string
          description: >-
            The person who answers for a goal, an initiative or an epic; empty
            takes them off. On any other card 422 `ownerIsThePlans`.
        customers:
          type: array
          description: >-
            Ids from the board's customer roster this card names, replacing
            those it named; empty takes them all off. An id the roster lacks is
            422 `customerNotFound`.
          items:
            type: string
        zone:
          type: string
          enum: ["", urgent, unplanned, planned, niceToHave]
        size:
          type: string
          description: S, M, L or XL in any case; empty takes the size back.
        assignees:
          type: array
          items:
            type: string
        progress:
          type: integer
          description: 0..100.
        stage:
          type: string
          enum: ["", locked, review, recurrent, refuse, done]
          description: >-
            A name the board does not have is refused rather than stored.
            "done" clears the stage and fills 100; review and locked clamp the
            progress into [10, 90]. Setting `review` on a task with no review
            card makes one — «review: <title>», of the task's team, with nobody
            on it, parked in that team's backlog (the "needs a reviewer" item);
            name a reviewer with send-to-review, or with `own` on that card.
        recurrence:
          type: string
        dates:
          $ref: '#/components/schemas/CardDatesPatch'
        parked:
          type: boolean
          description: >-
            `true` parks the task in its team's backlog; `false` takes a parked
            task that is already in work out of it, and is refused (422
            `takeIntoWork`) on one with no date and no sprint — set a date, a
            sprint or `own` a person instead.
        reviewOf:
          type: string
        parent:
          type: string
          description: >-
            Puts the card under another one; empty takes it out. Under a TASK
            the card becomes a subtask (its team, person and sprint follow);
            under a goal, an initiative or an epic it is filed in the hierarchy
            and nothing else changes. The level rule and the repository rule
            hold (422 `parentLevel`, `crossDomain`).
    CardDatesPatch:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        sprint:
          type: string
    RemoveCardBody:
      type: object
      properties:
        intent:
          type: string
          description: >-
            "unassign", "off-board", or left out for the gesture to decide for
            itself. Anything else is refused (400).
    OwnBody:
      type: object
      properties:
        team:
          type: string
          description: The team the card is handed to; empty with an empty person takes the team off.
        person:
          type: string
          description: The person on that team the card is handed to; needs a team.
    MoveCardBody:
      type: object
      properties:
        after:
          type: string
          description: The card to land behind; empty means the top.
        before:
          type: string
          description: The card to land in front of. It wins when both are sent.
    DeferCardBody:
      type: object
      properties:
        days:
          type: integer
          description: How many days ahead of today the card is pushed; must be positive.
    SetPriorityBody:
      type: object
      required: [priority]
      properties:
        priority:
          type: string
          enum: ["", P0, P1, P2, P3, P4]
          description: The card's own priority; empty clears it.
    UnassignWorkBody:
      type: object
      properties:
        dryRun:
          type: boolean
          description: >-
            Name what the gesture would take — in `items`, as they stand —
            and write nothing: what a confirm counts. The reader's Roadmap
            may be filtered; this answers for the whole board.
        uids:
          type: array
          description: >-
            Exactly the tasks to take out of work, when given — the ones the
            confirm counted. Each must be one the gesture reaches from the
            card (422 `notATarget` otherwise). Absent: every task it reaches.
          items:
            type: string
    WorkChange:
      type: object
      additionalProperties: false
      required: [changed, items]
      description: What a status gesture on the Roadmap changed.
      properties:
        changed:
          type: integer
          description: >-
            How many tasks changed — on a plan item, every task under it the
            gesture reached; a task already as asked is not counted.
        items:
          type: array
          description: >-
            The changed tasks as they stand after the gesture, as the caller
            may see them. The watch does not echo a client's own writes, so
            this is how the acting tab learns what it did; the plan items
            above them re-derive their standing (and reach every watcher).
          items:
            $ref: '#/components/schemas/Card'
    SendToReviewBody:
      type: object
      properties:
        reviewer:
          type: string
        day:
          type: string
        zone:
          type: string
          enum: ["", urgent, unplanned, planned, niceToHave]
          description: >-
            Where the review card stands; empty is the unplanned band, which is
            where the asking belongs.
    NoteBody:
      type: object
      properties:
        text:
          type: string
    SprintPatch:
      type: object
      properties:
        team:
          type: string
        current:
          type: string
        previous:
          type: string
        domain:
          type: string
          description: >-
            The repository a NEW team is declared in; an existing team's pointer
            stays where the team is.
    PersonPatch:
      type: object
      required: [capacity]
      properties:
        capacity:
          type: integer
          x-go-type: '*int'
          description: >-
            The points a week; 0 takes a set number back. It is required — a
            body without it is refused (400) rather than read as zero.
    CarryOverBody:
      type: object
      properties:
        team:
          type: string
        dryRun:
          type: boolean
          description: Report the counts and change nothing.
    ReorderTeamsBody:
      type: object
      properties:
        teams:
          type: array
          items:
            type: string
    TeamBody:
      type: object
      properties:
        team:
          type: string
    AddCustomerBody:
      type: object
      properties:
        name:
          type: string
    CustomerBody:
      type: object
      properties:
        customer:
          type: string
          description: The customer's id.
    RenameCustomerBody:
      type: object
      properties:
        customer:
          type: string
          description: The customer's id.
        to:
          type: string
    ReorderCustomersBody:
      type: object
      properties:
        customers:
          type: array
          items:
            type: string
    RenameTeamBody:
      type: object
      properties:
        team:
          type: string
        to:
          type: string
    TeamCapacityBody:
      type: object
      required: [points]
      properties:
        team:
          type: string
        points:
          type: integer
          x-go-type: '*int'
          description: >-
            The points a week; 0 takes the number back. It is required — a body
            without it is refused (400) rather than read as zero.
    PresenceBody:
      type: object
      properties:
        card:
          type: string
          description: The card the caller has selected; empty clears the mark.
    WatchFrame:
      description: >-
        One frame of the watch stream. No operation references it — a WebSocket
        upgrade has no response body to describe — but a client applying the
        stream needs the shapes, so they are stated here.
      oneOf:
        - $ref: '#/components/schemas/CardFrame'
        - $ref: '#/components/schemas/SprintFrame'
        - $ref: '#/components/schemas/OrderingFrame'
        - $ref: '#/components/schemas/PresenceFrame'
        - $ref: '#/components/schemas/BoardFrame'
        - $ref: '#/components/schemas/LoadFrame'
        - $ref: '#/components/schemas/SyncFrame'
        - $ref: '#/components/schemas/QueueFrame'
        - $ref: '#/components/schemas/SyncErrorFrame'
        - $ref: '#/components/schemas/StatusFrame'
    CardFrame:
      type: object
      description: >-
        A card changed. On a SCOPED subscription the verb is about the
        SELECTION: a card entering it arrives as ADDED and one leaving it as
        DELETED, whatever became of the card itself.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [ADDED, MODIFIED, DELETED]
        kind:
          type: string
          enum: [Card]
        object:
          $ref: '#/components/schemas/Card'
    SprintFrame:
      type: object
      description: >-
        A team's sprint pointer moved. It is shaped exactly as the listing
        shapes it, because a client merges the frame into what it holds: a field
        the frame left out would be a field the client LOSES.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Sprint]
        object:
          $ref: '#/components/schemas/Sprint'
    OrderingFrame:
      type: object
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Ordering]
        object:
          $ref: '#/components/schemas/Ordering'
    PresenceFrame:
      type: object
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Presence]
        object:
          $ref: '#/components/schemas/Presence'
    Presence:
      type: object
      additionalProperties: false
      description: >-
        One person's live selection, from one of their tabs: `client` is the
        tab (its `X-Aeman-Client`), the key a selection is held by, so two
        tabs of one person are two selections; an empty `card` clears it.
      required: [login, card]
      properties:
        login:
          type: string
        card:
          type: string
        client:
          type: string
    BoardFrame:
      type: object
      description: >-
        The board's STRUCTURE changed — a team, a customer, a capacity. It
        carries the whole board resource, so a client applies it without a
        round trip, and it is coalesced for a burst of writes.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Board]
        object:
          type: object
          additionalProperties: false
          description: >-
            The board resource. Stated field by field rather than composed out
            of Board: a closed schema cannot be extended by an allOf, and the
            closure is what catches a field added in Go without a line here.
          required: [kind, metadata]
          properties:
            kind:
              type: string
              enum: [Board]
            metadata:
              $ref: '#/components/schemas/BoardMetadata'
    LoadFrame:
      type: object
      description: >-
        What the board's PEOPLE are holding. Those numbers are summed over cards
        from every team, so a client holding one view's cards can neither
        compute them nor learn them from the card events it receives. Shaped as
        `metadata.members`, to be merged in place.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Load]
        object:
          type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/Member'
    SyncFrame:
      type: object
      description: The board cache was reloaded; the moment it now reflects.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Sync]
        object:
          type: object
          required: [loadedAt]
          properties:
            loadedAt:
              type: string
    QueueFrame:
      type: object
      description: How many writes are still unsynced; the UI hides the number at zero.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [MODIFIED]
        kind:
          type: string
          enum: [Queue]
        object:
          type: object
          required: [pending]
          properties:
            pending:
              type: integer
    StatusFrame:
      type: object
      description: >-
        The LAST frame of a watch that fell behind (G85): a frame did not fit
        in the watcher's buffer, so what the client holds is out of date.
        Nothing follows it and the server closes the stream. The client
        re-LISTs its view and opens a new watch — what it would do after any
        dropped connection. Kubernetes' shape: an ERROR carrying a Status of
        code 410, reason Expired.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [ERROR]
        kind:
          type: string
          enum: [Status]
        object:
          type: object
          required: [kind, status, reason, code]
          properties:
            kind:
              type: string
              enum: [Status]
            status:
              type: string
              enum: [Failure]
            reason:
              type: string
              enum: [Expired]
            code:
              type: integer
              enum: [410]
            message:
              type: string
    SyncErrorFrame:
      type: object
      description: >-
        A write was lost after its retries. Nobody is spared this one — the
        client that made the change needs the rollback most of all.
      required: [type, kind, object]
      properties:
        type:
          type: string
          enum: [ERROR]
        kind:
          type: string
          enum: [SyncError]
        object:
          type: object
          required: [message]
          properties:
            message:
              type: string
