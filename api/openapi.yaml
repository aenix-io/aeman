          type: string
          description: >-
            The card's column, which is the (project, epic) PAIR — epic names
            repeat across projects, so anything acting on a column names both
            halves.
        project:
          type: string
        mirrors:
          type: array
          description: >-
            The additional columns the same card stands in — one file, one log,
            one set of dates — always in the card's own repository.
          items:
            $ref: '#/components/schemas/Placement'
        process:
          type: string
          description: >-
            The process this card is a turn of, or the one it was tied to
