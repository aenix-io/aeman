            type: array
            items:
              $ref: '#/components/schemas/LogEntry'
    Link:
      type: object
      additionalProperties: false
      x-go-type: board.Link
      x-go-type-import:
        path: github.com/aenix-io/aeman/pkg/board
      description: >-
        One URL from a card's description. A GitHub issue or pull request is
        resolved to its live title and state where the server can read it.
      required: [url, kind]
      properties:
        url:
          type: string
        kind:
          type: string
        owner:
          type: string
        repo:
          type: string
        number:
          type: integer
        title:
          type: string
        state:
          type: string
    LinkList:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [LinkList]
        items:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    SprintList:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [SprintList]
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sprint'
    NoteList:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [NoteList]
        items:
