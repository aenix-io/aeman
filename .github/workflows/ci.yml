name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13.2

  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build & test frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
      # Both artifacts built from api/openapi.yaml are committed: the image
      # copies the tree and builds it (Dockerfile), this job runs make backend
      # and the frontend step above builds the SPA, and an external importer
      # compiles pkg/ as it is checked out — no generate step among them. The
      # TypeScript half needs the npm install the frontend step already did.
      - name: Generated code is current
        run: |
          make generate
          # Staged, not a bare diff: a generator that started writing a NEW
          # path would leave it untracked, and git diff does not see those.
          git add -A internal/server/apiv1 web/src/api
          git diff --cached --exit-code internal/server/apiv1 web/src/api
      - name: Build binary
        run: make backend
      # CI runs on Linux only, so the Windows half of the data-directory
      # lock is otherwise never type-checked. vet rather than build: build
      # skips _test.go, which is where that half is exercised.
      - name: Cross-check for Windows
        run: GOOS=windows go vet ./...
      # -race, not a plain run: the board cache is read by HTTP handlers and
      # the watch fan-out while the git sync writes it, and a plain build
      # cannot see that class of bug at all. It costs roughly half again as
      # long as the uninstrumented suite.
      - name: Test
        run: go test -race ./...
