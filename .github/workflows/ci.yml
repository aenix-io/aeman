name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build & test frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build binary
        run: make backend
      # CI runs on Linux only, so the Windows half of the data-directory
      # lock is otherwise never type-checked. vet rather than build: build
      # skips _test.go, which is where that half is exercised.
      - name: Cross-check for Windows
        run: GOOS=windows go vet ./...
      - name: Test
        run: go test ./...
