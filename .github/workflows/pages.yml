name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/src/styles.css'
      - 'docs/logo.svg'
      - 'docs/assets/app-icon.png'
      - 'README.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'web/src/styles.css'
      - 'docs/logo.svg'
      - 'docs/assets/app-icon.png'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No npm install: the landing page uses only Node's standard library.
      - run: node --test site/appearance.test.mjs
      - name: Build landing page
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node site/build.mjs
      - run: node --test site/build.test.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
