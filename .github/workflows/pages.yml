name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/src/styles.css'
      - 'docs/logo.svg'
      - 'docs/assets/app-icon.png'
      - 'README.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'web/src/styles.css'
      - 'docs/logo.svg'
      - 'docs/assets/app-icon.png'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      # No npm install: the landing page uses only Node's standard library.
      - run: node --test site/appearance.test.mjs
      - name: Build landing page
        env:
          # Upstream is served on its own domain; a fork publishes under its
          # owner's github.io path.
          SITE_URL: ${{ github.repository == 'aenix-io/aeman' && 'https://aeman.aenix.io/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node site/build.mjs
      - run: node --test site/build.test.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
